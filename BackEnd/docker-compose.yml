services:
  mysql-db:
    image: mysql:8.0
    container_name: badminton_mysql
    restart: always
    environment:
      MYSQL_DATABASE: dat_san_cau_long
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: dat_san_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    command: ["--default-time-zone=+07:00"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - badminton-net

  backend-app:
    build: .
    container_name: badminton_backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/dat_san_cau_long?connectionTimeZone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-dat_san_app}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - TZ=Asia/Ho_Chi_Minh
      - BOOKING_HOLD_MINUTES=${BOOKING_HOLD_MINUTES:-15}
      - BOOKING_EXPIRY_SCAN_MS=${BOOKING_EXPIRY_SCAN_MS:-30000}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-vdong4419@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - badminton-net

volumes:
  mysql_data:

networks:
  badminton-net:
    driver: bridge
